plugins {
	id 'java'
}

group = 'com.tacticalpings'
version = '1.1.0'

repositories {
	maven {
		url = 'https://repo.runelite.net'
		content { includeGroupByRegex('net\\.runelite.*') }
	}
	mavenCentral()
}

def runeLiteVersion = providers.gradleProperty('runeliteVersion').getOrElse('latest.release')

dependencies {
	compileOnly "net.runelite:client:${runeLiteVersion}"
	testImplementation "net.runelite:client:${runeLiteVersion}"
	testImplementation 'junit:junit:4.13.2'
	testImplementation 'org.mockito:mockito-core:4.11.0'
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release = 11
}

tasks.register('run', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.tacticalpings.TacticalPingsLauncher'
	args '--developer-mode'
	jvmArgs '-ea'
}

tasks.register('preview', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.tacticalpings.PingPreview'
	jvmArgs '-Djava.awt.headless=true'
}

jar {
	from('runelite-plugin.properties')
	from('LICENSE')
}
